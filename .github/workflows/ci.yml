name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hello-zeshawn:${{ github.sha }} .

      - name: Scan image for vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: hello-zeshawn:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
