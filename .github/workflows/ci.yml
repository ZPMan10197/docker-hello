name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect --source /path --exit-code 1

      - name: Build Docker image
        run: docker build -t hello-zeshawn:${{ github.sha }} .

      - name: Scan image for vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hello-zeshawn:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
